name: Weekly pollen levels

on:
  schedule:
    - cron: "47 3 * * *"   # 05:47 Cape Town; new UCT reports usually appear on Fridays
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pollen
  cancel-in-progress: false

jobs:
  pollen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update data/pollen.json
        run: python scripts/public_pollen.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/pollen.json && git ls-files --error-unmatch data/pollen.json >/dev/null 2>&1; then echo "Nothing new."; exit 0; fi
          git config user.name "pollen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pollen.json
          git commit -m "Pollen levels $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
